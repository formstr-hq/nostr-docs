<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/formstr-pages-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pages by Form*</title>
    <!-- Roboto font (Material UI official default) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
    />

    <!-- SEO & Social Preview -->
    <meta
      name="description"
      content="Formstr Pages – your private, Nostr-based note-taking app. Capture thoughts, ideas, and notes securely and effortlessly."
    />

    <!-- Open Graph (for Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Formstr Pages" />
    <meta
      property="og:description"
      content="Your private, Nostr-based note-taking app."
    />
    <meta property="og:image" content="/formstr-pages-logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pages.formstr.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Formstr Pages" />
    <meta
      name="twitter:description"
      content="Your private, Nostr-based note-taking app."
    />
    <meta name="twitter:image" content="/formstr-pages-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
